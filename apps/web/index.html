      <h1>crt.watch — Zertifikate und Dienste überwachen</h1>
      <p>
        crt.watch überwacht TLS-Zertifikate und die Dienste dahinter: Restlaufzeit,
        Kette und Vertrauen, Namen und SANs, TLS-Fassungen und Verschlüsselungen,
        STARTTLS bei SMTP, IMAP, POP3 und FTP, direktes TLS bei SMTPS, IMAPS, POP3S,
        LDAPS und FTPS, HTTP- und HTTPS-Adressen, SSH-Kennungen, Anmeldungen bei
        Diensten, die Auflösung im DNS und die Bewertung von SSL Labs. Die Meldung
        kommt per Mail, Chat oder Webhook, solange noch Zeit zum Handeln ist.
      </p>
      <p>
        Der Dienst läuft in einem Docker-Container mit SQLite auf der Platte und
        bringt Statusseiten für Kunden, einbettbare Abzeichen, eine REST-Schnittstelle
        und Kennzahlen für Prometheus mit.
      </p>
