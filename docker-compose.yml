services:
  crt-watch:
    image: ghcr.io/brightcolor/crt-watch:latest
    container_name: crt-watch
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - "NODE_ENV=${NODE_ENV:-production}"
      - "TZ=${TZ:-Europe/Berlin}"
      - "PORT=${PORT:-8080}"
      - "BASE_URL=${BASE_URL:-http://localhost:${HOST_PORT:-8080}}"
      - "DATABASE_PATH=${DATABASE_PATH:-/data/crtwatch.sqlite}"
      - "SESSION_SECRET=${SESSION_SECRET:-change-this-long-random-secret}"
      - "TRUST_PROXY=${TRUST_PROXY:-false}"
      - "COOKIE_SECURE=${COOKIE_SECURE:-false}"
      - "FRONT_PAGE_ENABLED=${FRONT_PAGE_ENABLED:-true}"
      - "PUBLIC_REGISTRATION_ENABLED=${PUBLIC_REGISTRATION_ENABLED:-true}"
      - "ALLOW_PRIVATE_TARGETS=${ALLOW_PRIVATE_TARGETS:-false}"
      - "ALLOW_PRIVATE_NOTIFICATION_TARGETS=${ALLOW_PRIVATE_NOTIFICATION_TARGETS:-false}"
      - "NOTIFICATION_ALLOWED_NETWORKS=${NOTIFICATION_ALLOWED_NETWORKS:-}"
      - "NOTIFICATION_MAX_REDIRECTS=${NOTIFICATION_MAX_REDIRECTS:-3}"
      - "NOTIFICATION_TIMEOUT_SECONDS=${NOTIFICATION_TIMEOUT_SECONDS:-10}"
      - "RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}"
      - "RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-1200}"
      - "AUTH_RATE_LIMIT_WINDOW_MINUTES=${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}"
      - "AUTH_RATE_LIMIT_MAX_ATTEMPTS=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-10}"
      - "CONTENT_SECURITY_POLICY=${CONTENT_SECURITY_POLICY:-enforce}"
      - "CONTENT_SECURITY_POLICY_IMAGE_SOURCES=${CONTENT_SECURITY_POLICY_IMAGE_SOURCES:-self data: https:}"
      - "METRICS_ACCESS=${METRICS_ACCESS:-authenticated}"
      - "METRICS_TOKEN=${METRICS_TOKEN:-}"
      - "PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-12}"
      - "CHECK_CONCURRENCY=${CHECK_CONCURRENCY:-4}"
      - "DEFAULT_INTERVAL_SECONDS=${DEFAULT_INTERVAL_SECONDS:-3600}"
      - "DEFAULT_WARNING_DAYS=${DEFAULT_WARNING_DAYS:-30}"
      - "DEFAULT_CRITICAL_DAYS=${DEFAULT_CRITICAL_DAYS:-7}"
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    volumes:
      - "${DATA_DIR:-./data}:/data"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: "curl -fsS http://localhost:$${PORT:-8080}/api/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
